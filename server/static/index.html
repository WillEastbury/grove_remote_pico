<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hisense IR Remote</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #eee;
    }

    /* ── Login screen ─────────────────────────────────────────────── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 48px;
      background: #1e1e1e;
      border-radius: 20px;
      box-shadow: 0 8px 32px #0008;
    }
    #login-screen h1 { font-size: 1.8rem; letter-spacing: 1px; }
    #login-screen p  { color: #999; font-size: 0.95rem; }
    .google-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 28px;
      background: #fff;
      color: #333;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: box-shadow 0.2s;
    }
    .google-btn:hover { box-shadow: 0 4px 16px #0006; }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ── Remote wrapper ───────────────────────────────────────────── */
    #remote-screen { display: none; flex-direction: column; align-items: center; gap: 16px; }

    .remote {
      width: 280px;
      background: linear-gradient(160deg, #2a2a2a 0%, #1a1a1a 100%);
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 12px 40px #0009, inset 0 1px 0 #ffffff18;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .remote-title {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #666;
    }

    /* ── Button styles ────────────────────────────────────────────── */
    .btn {
      border: none;
      cursor: pointer;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ddd;
      background: #333;
      box-shadow: 0 4px 8px #0005, inset 0 1px 0 #ffffff14;
      transition: transform 0.08s, box-shadow 0.08s, background 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      user-select: none;
    }
    .btn:hover  { background: #444; }
    .btn:active { transform: scale(0.93); box-shadow: 0 2px 4px #0005; }

    .btn.wide   { border-radius: 26px; width: auto; padding: 0 20px; min-width: 52px; }
    .btn.small  { width: 42px; height: 42px; font-size: 0.65rem; }

    .btn.red    { background: #c0392b; color: #fff; }
    .btn.red:hover { background: #e74c3c; }
    .btn.blue   { background: #1a6db5; color: #fff; }
    .btn.blue:hover { background: #2980b9; }
    .btn.green  { background: #27ae60; color: #fff; }
    .btn.green:hover { background: #2ecc71; }
    .btn.dark   { background: #252525; }

    .btn svg { width: 18px; height: 18px; pointer-events: none; }

    /* status flash */
    .btn.sent { background: #27ae60 !important; transition: none; }

    /* ── Row layouts ──────────────────────────────────────────────── */
    .row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .row.spread { justify-content: space-between; }

    /* ── D-pad ────────────────────────────────────────────────────── */
    .dpad {
      display: grid;
      grid-template-columns: 52px 52px 52px;
      grid-template-rows:    52px 52px 52px;
      gap: 4px;
      place-items: center;
      align-self: center;
    }
    .dpad .btn { width: 52px; height: 52px; }

    /* ── Streaming row ────────────────────────────────────────────── */
    .stream-row { display: flex; justify-content: center; gap: 8px; }
    .stream-btn {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: transform 0.08s, filter 0.1s;
    }
    .stream-btn:active { transform: scale(0.93); }
    .stream-btn.netflix { background: #e50914; color: #fff; }
    .stream-btn.amazon  { background: #ff9900; color: #111; }
    .stream-btn.youtube { background: #ff0000; color: #fff; }
    .stream-btn.itvx    { background: #f8c100; color: #111; }
    .stream-btn.iplayer { background: #ec1e3e; color: #fff; }
    .stream-btn.nowtv   { background: #00deb6; color: #001a14; }
    .stream-btn.freely  { background: #5e60ce; color: #fff; }
    .stream-btn.spotify { background: #1db954; color: #000; }

    /* ── Divider ──────────────────────────────────────────────────── */
    .divider { border: none; border-top: 1px solid #2e2e2e; margin: 2px 0; }

    /* ── User badge ───────────────────────────────────────────────── */
    .user-badge {
      font-size: 0.78rem;
      color: #888;
      text-align: center;
    }
    .user-badge span { color: #aaa; }

    /* ── Status pill in remote header ────────────────────────────── */
    .remote-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #222;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.65rem;
      color: #bbb;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      letter-spacing: 0.3px;
    }
    .status-pill:hover { background: #2a2a2a; border-color: #444; }
    .status-pill .pill-led {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #444;
    }
    .status-pill .pill-led.on  { background: #27ae60; box-shadow: 0 0 4px #27ae60aa; }
    .status-pill .pill-led.off { background: #c0392b; box-shadow: 0 0 4px #c0392baa; }

    /* ── Status modal ─────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #000c;
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      animation: fadeIn 0.15s ease-out;
    }
    .modal-backdrop.show { display: flex; }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }

    /* ── Status panel (used inside the modal) ────────────────────── */
    .status-panel {
      width: min(420px, 92vw);
      background: #1a1a1a;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: 0 16px 48px #000c, inset 0 1px 0 #ffffff10;
      font-size: 0.85rem;
      color: #bbb;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
    }
    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .status-header h2 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #eee;
    }
    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
    }
    .close-btn:hover { color: #fff; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .led {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #444;
      box-shadow: 0 0 4px #0006 inset;
      flex-shrink: 0;
    }
    .led.on  { background: #27ae60; box-shadow: 0 0 6px #27ae60aa; }
    .led.off { background: #c0392b; box-shadow: 0 0 6px #c0392baa; }
    .status-row .label { color: #888; }
    .status-row .value { color: #ddd; margin-left: auto; font-variant-numeric: tabular-nums; }

    .status-divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 12px 0 8px;
    }
    .status-title {
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .history-list {
      list-style: none;
      max-height: 50vh;
      overflow-y: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.75rem;
    }
    .history-list li {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #ffffff08;
      align-items: baseline;
    }
    .history-list li:last-child { border-bottom: none; }
    .h-time  { color: #666; }
    .h-name  { color: #e8e8e8; }
    .h-proto {
      color: #888;
      background: #ffffff10;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .h-proto.nec  { color: #ffc857; }
    .h-proto.rc5  { color: #b5e48c; }
    .h-proto.sony { color: #ff8fab; }
    .history-empty { color: #555; text-align: center; padding: 12px 0; font-style: italic; }

    .h-status {
      grid-column: 1 / -1;
      font-size: 0.68rem;
      color: #555;
      padding-left: 72px;
    }
    .h-status.transmitted { color: #27ae60; }
    .h-status.queued      { color: #f39c12; }
    .h-status.sent        { color: #3498db; }

    /* ── Toast ────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #27ae60;
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: #c0392b; }
  </style>
</head>
<body>

<!-- ── Login ──────────────────────────────────────────────────────── -->
<div id="login-screen">
  <h1>📺 Hisense Remote</h1>
  <p>Sign in with Google to control your TV</p>
  <a href="/auth/login" class="google-btn">
    <!-- Google "G" logo SVG -->
    <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M47.5 24.5c0-1.6-.1-3.1-.4-4.6H24v8.7h13.2c-.6 3-2.3 5.5-5 7.2v6h8.1c4.7-4.3 7.2-10.7 7.2-17.3z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-8.1-6c-2.1 1.4-4.8 2.3-7.8 2.3-6 0-11.1-4-12.9-9.5H2.7v6.2C6.7 42.9 14.8 48 24 48z"/><path fill="#FBBC05" d="M11.1 29c-.5-1.4-.7-2.9-.7-4.5s.3-3.1.7-4.5v-6.2H2.7C1 17.3 0 20.5 0 24s1 6.7 2.7 9.2l8.4-4.2z"/><path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.4l6.6-6.6C35.9 2.5 30.5 0 24 0 14.8 0 6.7 5.1 2.7 12.8l8.4 6.2C12.9 13.5 18 9.5 24 9.5z"/></svg>
    Sign in with Google
  </a>
</div>

<!-- ── Remote ──────────────────────────────────────────────────────── -->
<div id="remote-screen">
  <div class="user-badge">Signed in as <span id="user-email"></span></div>

  <div class="remote">
    <div class="remote-title">
      <span>Hisense</span>
      <button class="status-pill" id="status-pill" title="Show status">
        <span class="pill-led" id="pill-led"></span>
        <span id="pill-text">status</span>
      </button>
    </div>

    <!-- Row 1: Power / Source / Mute -->
    <div class="row spread">
      <button class="btn red"  data-cmd="power">⏻</button>
      <button class="btn dark wide" data-cmd="source">Source</button>
      <button class="btn dark" data-cmd="mute">🔇</button>
    </div>

    <hr class="divider" />

    <!-- Row 2a: Streaming shortcuts -->
    <div class="stream-row">
      <button class="stream-btn netflix" data-cmd="netflix">NETFLIX</button>
      <button class="stream-btn amazon"  data-cmd="amazon">prime</button>
      <button class="stream-btn youtube" data-cmd="youtube">▶ YouTube</button>
    </div>

    <!-- Row 2b: UK streaming shortcuts -->
    <div class="stream-row">
      <button class="stream-btn itvx"    data-cmd="itvx">ITVX</button>
      <button class="stream-btn iplayer" data-cmd="iplayer">iPlayer</button>
      <button class="stream-btn nowtv"   data-cmd="nowtv">NOW</button>
    </div>

    <!-- Row 2c: Other launchers -->
    <div class="stream-row">
      <button class="stream-btn freely"  data-cmd="freely">Freely</button>
      <button class="stream-btn spotify" data-cmd="spotify">♪ Spotify</button>
    </div>

    <hr class="divider" />

    <!-- Row 3: Vol / Ch -->
    <div class="row spread">
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <button class="btn blue" data-cmd="vol_up">VOL+</button>
        <button class="btn blue" data-cmd="vol_down">VOL−</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
        <button class="btn dark" data-cmd="ch_up">CH+</button>
        <button class="btn dark" data-cmd="ch_down">CH−</button>
      </div>
    </div>

    <hr class="divider" />

    <!-- Row 4: D-pad -->
    <div class="dpad">
      <div></div>
      <button class="btn" data-cmd="up">▲</button>
      <div></div>
      <button class="btn" data-cmd="left">◀</button>
      <button class="btn green" data-cmd="ok">OK</button>
      <button class="btn" data-cmd="right">▶</button>
      <div></div>
      <button class="btn" data-cmd="down">▼</button>
      <div></div>
    </div>

    <!-- Row 5: Back / Home / Menu -->
    <div class="row">
      <button class="btn small dark" data-cmd="back">⬅</button>
      <button class="btn small dark" data-cmd="home">⌂</button>
      <button class="btn small dark" data-cmd="menu">☰</button>
    </div>

    <hr class="divider" />

    <!-- Row 6-8: Numeric pad -->
    <div class="row"><button class="btn small" data-cmd="1">1</button><button class="btn small" data-cmd="2">2</button><button class="btn small" data-cmd="3">3</button></div>
    <div class="row"><button class="btn small" data-cmd="4">4</button><button class="btn small" data-cmd="5">5</button><button class="btn small" data-cmd="6">6</button></div>
    <div class="row"><button class="btn small" data-cmd="7">7</button><button class="btn small" data-cmd="8">8</button><button class="btn small" data-cmd="9">9</button></div>
    <div class="row"><div style="width:42px"></div><button class="btn small" data-cmd="0">0</button><div style="width:42px"></div></div>
  </div>

  <!-- ── Status modal ──────────────────────────────────────────────── -->
  <div class="modal-backdrop" id="status-modal">
    <div class="status-panel">
      <div class="status-header">
        <h2>Remote status</h2>
        <button class="close-btn" id="status-close" aria-label="Close">×</button>
      </div>

      <div class="status-row">
        <span class="led" id="pico-led"></span>
        <span class="label">Pico</span>
        <span class="value" id="pico-state">checking…</span>
      </div>
      <div class="status-row">
        <span class="label" style="margin-left:17px">Last poll</span>
        <span class="value" id="pico-last">—</span>
      </div>

      <hr class="status-divider" />

      <div class="status-title">Address sweep (debug)</div>
      <div style="font-size:0.8em;color:#888;margin-bottom:6px">
        Fires power-toggle at every NEC address.  Watch the TV — note when it
        reacts and which address byte was sent.
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <input id="sweep-cmd" type="text" value="0x12" style="width:60px;padding:4px;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:4px"/>
        <button id="sweep-btn" style="padding:6px 12px;background:#e67e22;color:#000;border:none;border-radius:4px;cursor:pointer">Sweep 0x00–0xFF</button>
      </div>

      <hr class="status-divider" />
      <ul class="history-list" id="history-list">
        <li class="history-empty">No commands yet</li>
      </ul>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── Token management ────────────────────────────────────────────────
  const TOKEN_KEY    = 'ir_jwt';
  const TOKEN_EMAIL  = 'ir_email';
  const EXPIRE_DAYS  = 30;

  function saveToken(token) {
    const expiry = Date.now() + EXPIRE_DAYS * 86400_000;
    localStorage.setItem(TOKEN_KEY,   token);
    localStorage.setItem(TOKEN_KEY + '_exp', expiry);
  }

  function loadToken() {
    const token  = localStorage.getItem(TOKEN_KEY);
    const expiry = parseInt(localStorage.getItem(TOKEN_KEY + '_exp') || '0', 10);
    if (!token || Date.now() > expiry) {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(TOKEN_KEY + '_exp');
      return null;
    }
    return token;
  }

  function parseEmailFromJwt(token) {
    try {
      const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      return payload.sub || '';
    } catch { return ''; }
  }

  // ── Boot: check for token in fragment or localStorage ─────────────
  (function boot() {
    // Token delivered via URL fragment after OAuth callback
    const hash = window.location.hash;
    if (hash.startsWith('#token=')) {
      const token = hash.slice(7);
      saveToken(token);
      history.replaceState(null, '', '/');   // strip fragment from URL
      showRemote(token);
      return;
    }

    const token = loadToken();
    if (token) {
      showRemote(token);
    } else {
      document.getElementById('login-screen').style.display = 'flex';
    }
  })();

  function showRemote(token) {
    document.getElementById('login-screen').style.display = 'none';
    const rs = document.getElementById('remote-screen');
    rs.style.display = 'flex';
    document.getElementById('user-email').textContent = parseEmailFromJwt(token);
    startStatusPolling();
  }

  // ── Status panel polling ────────────────────────────────────────────
  let _statusTimer = null;
  let _modalOpen   = false;

  function fmtAgo(seconds) {
    if (seconds == null) return 'never';
    if (seconds < 1)     return 'just now';
    if (seconds < 60)    return `${Math.floor(seconds)}s ago`;
    if (seconds < 3600)  return `${Math.floor(seconds/60)}m ${Math.floor(seconds%60)}s ago`;
    return `${Math.floor(seconds/3600)}h ago`;
  }

  function fmtCode(item) {
    const p = (item.protocol || '').toLowerCase();
    if (p === 'nec' || p === 'rc5') {
      const addr = item.address  ?? 0;
      const cmd  = item.command  ?? 0;
      return `0x${addr.toString(16).padStart(2,'0').toUpperCase()}:0x${cmd.toString(16).padStart(2,'0').toUpperCase()}`;
    }
    if (p === 'sony') {
      return `0x${(item.data ?? 0).toString(16).toUpperCase()} (${item.bits ?? '?'}b)`;
    }
    return '—';
  }

  function fmtTime(iso) {
    if (!iso) return '--:--:--';
    const d = new Date(iso);
    return d.toLocaleTimeString('en-GB', { hour12: false });
  }

  async function refreshStatus() {
    const token = loadToken();
    if (!token) return;
    try {
      const res = await fetch('/api/status', {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) return;
      const data = await res.json();

      const pico = data.pico || {};

      // Always update the pill (small footprint, visible in remote header)
      const pillLed  = document.getElementById('pill-led');
      const pillText = document.getElementById('pill-text');
      if (pico.connected) {
        pillLed.className  = 'pill-led on';
        pillText.textContent = 'online';
      } else if (pico.last_seen) {
        pillLed.className  = 'pill-led off';
        pillText.textContent = 'offline';
      } else {
        pillLed.className  = 'pill-led';
        pillText.textContent = 'waiting';
      }

      // Skip rendering the modal contents while closed
      if (!_modalOpen) return;

      const led   = document.getElementById('pico-led');
      const state = document.getElementById('pico-state');
      const last  = document.getElementById('pico-last');

      if (pico.connected) {
        led.className = 'led on';
        state.textContent = 'connected';
        state.style.color = '#7fdca0';
      } else if (pico.last_seen) {
        led.className = 'led off';
        state.textContent = 'offline';
        state.style.color = '#ff8a80';
      } else {
        led.className = 'led';
        state.textContent = 'never seen';
        state.style.color = '#888';
      }
      last.textContent = fmtAgo(pico.seconds_since);

      const ul = document.getElementById('history-list');
      const hist = data.history || [];
      if (hist.length === 0) {
        ul.innerHTML = '<li class="history-empty">No commands yet</li>';
        return;
      }
      ul.innerHTML = hist.map(h => `
        <li>
          <span class="h-time">${fmtTime(h.queued_at)}</span>
          <span class="h-name">${h.name || '?'}</span>
          <span class="h-proto ${(h.protocol||'').toLowerCase()}">${h.protocol || '?'}</span>
          <span class="h-status ${h.status||''}">${fmtCode(h)} · ${h.status||'queued'}</span>
        </li>
      `).join('');
    } catch (err) {
      // Silent — polling will retry
    }
  }

  function startStatusPolling() {
    if (_statusTimer) return;
    refreshStatus();
    _statusTimer = setInterval(refreshStatus, 3000);
  }

  // ── Modal open/close ────────────────────────────────────────────────
  function openStatusModal() {
    _modalOpen = true;
    document.getElementById('status-modal').classList.add('show');
    refreshStatus();
  }
  function closeStatusModal() {
    _modalOpen = false;
    document.getElementById('status-modal').classList.remove('show');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('status-pill').addEventListener('click', openStatusModal);
    document.getElementById('status-close').addEventListener('click', closeStatusModal);
    document.getElementById('status-modal').addEventListener('click', (e) => {
      if (e.target.id === 'status-modal') closeStatusModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && _modalOpen) closeStatusModal();
    });

    document.getElementById('sweep-btn').addEventListener('click', async () => {
      const token = loadToken();
      if (!token) { location.reload(); return; }
      const raw = document.getElementById('sweep-cmd').value.trim();
      const command = parseInt(raw, raw.toLowerCase().startsWith('0x') ? 16 : 10);
      if (isNaN(command) || command < 0 || command > 255) {
        showToast('Command must be 0x00–0xFF', true);
        return;
      }
      if (!confirm(`Fire ${command.toString(16)} at addresses 0x00–0xFF (256 frames)?`)) return;
      try {
        const res = await fetch('/api/command/sweep', {
          method:  'POST',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body:    JSON.stringify({ command }),
        });
        if (!res.ok) {
          showToast(`Sweep error ${res.status}`, true);
          return;
        }
        const j = await res.json();
        showToast(`Sweep queued: ${j.queued} frames`);
        refreshStatus();
      } catch (err) {
        showToast(`Network error: ${err.message}`, true);
      }
    });
  });

  // ── Button click handler ────────────────────────────────────────────
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-cmd]');
    if (!btn) return;

    const cmd   = btn.dataset.cmd;
    const token = loadToken();
    if (!token) { location.reload(); return; }

    try {
      const res = await fetch(`/api/command/button/${cmd}`, {
        method:  'POST',
        headers: { 'Authorization': `Bearer ${token}` },
      });

      if (res.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        showToast('Session expired — please sign in again', true);
        setTimeout(() => location.reload(), 1500);
        return;
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        showToast(err.detail || `Error ${res.status}`, true);
        return;
      }

      // Visual feedback
      btn.classList.add('sent');
      setTimeout(() => btn.classList.remove('sent'), 300);
      showToast(`Sent: ${cmd}`);
      refreshStatus();
    } catch (err) {
      showToast(`Network error: ${err.message}`, true);
    }
  });

  // ── Toast ───────────────────────────────────────────────────────────
  let _toastTimer;
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'show' + (isError ? ' error' : '');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { t.className = ''; }, 2500);
  }
</script>
</body>
</html>
